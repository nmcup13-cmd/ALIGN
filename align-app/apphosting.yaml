# Firebase App Hosting config. NEXT_PUBLIC_* values are safe to commit (Firebase Web SDK
# apiKey is not a secret — see src/lib/firebase/client.ts). FIREBASE_SERVICE_ACCOUNT_KEY is
# a real secret and MUST stay a Secret Manager reference, never an inline value — create it
# with: firebase apphosting:secrets:set FIREBASE_SERVICE_ACCOUNT_KEY --project nmc-align-2026
runConfig:
  minInstances: 0
  maxInstances: 1

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyB0yWl5Foi9xEO2i5ct3F1OBV_JQBkmxho
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: nmc-align-2026.firebaseapp.com
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: nmc-align-2026
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: nmc-align-2026.firebasestorage.app
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "344089558733"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:344089558733:web:8383be4a27fe913d98f384"
    availability: [BUILD, RUNTIME]
  - variable: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID
    value: G-G1GEWPM6TT
    availability: [BUILD, RUNTIME]
  - variable: FIREBASE_SERVICE_ACCOUNT_KEY
    secret: firebase-service-account-key
    availability: [RUNTIME]
