<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ALIGN — Full Mobile Prototype</title>
<style>
  :root {
    --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
    --border-default:#E2D9C8; --border-strong:#C9BBA0;
    --text-primary:#2B2620; --text-secondary:#6B6255; --text-disabled:#B3AA9A;
    --green:#5B6E4F; --green-dark:#46543D; --green-tint:#E8ECE2; --on-green:#FBF9F3;
    --draft:#9C7530; --draft-tint:#F3E6CE;
    --gap:#A65D45; --gap-tint:#F5E3DC;
    --cur-2565:#8C6F4E; --cur-2565-tint:#F1E9DD;
    --cur-2570:#5F7350; --cur-2570-tint:#EDF1E7;
    --page-bg:#DCD5C4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg-base:#201D18; --bg-surface:#29251F; --bg-sunken:#221F1A;
      --border-default:#3C362C; --border-strong:#554D3D;
      --text-primary:#EEE8DB; --text-secondary:#A79C89; --text-disabled:#6B6255;
      --green:#92A57E; --green-dark:#B0C09B; --green-tint:#333C2B; --on-green:#1B2016;
      --draft:#D8A857; --draft-tint:#3A2E17;
      --gap:#CC8267; --gap-tint:#3A241D;
      --cur-2565:#CBAC81; --cur-2565-tint:#362E20;
      --cur-2570:#9DB08C; --cur-2570-tint:#29321F;
      --page-bg:#141210;
    }
  }
  :root[data-theme="dark"] {
    --bg-base:#201D18; --bg-surface:#29251F; --bg-sunken:#221F1A;
    --border-default:#3C362C; --border-strong:#554D3D;
    --text-primary:#EEE8DB; --text-secondary:#A79C89; --text-disabled:#6B6255;
    --green:#92A57E; --green-dark:#B0C09B; --green-tint:#333C2B; --on-green:#1B2016;
    --draft:#D8A857; --draft-tint:#3A2E17;
    --gap:#CC8267; --gap-tint:#3A241D;
    --cur-2565:#CBAC81; --cur-2565-tint:#362E20;
    --cur-2570:#9DB08C; --cur-2570-tint:#29321F;
    --page-bg:#141210;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: var(--page-bg); color: var(--text-primary);
    font-family: "IBM Plex Sans Thai Looped","Noto Sans Thai Looped","Leelawadee UI","Segoe UI",sans-serif;
    font-size: 15px; line-height: 22px;
    display: flex; justify-content: center;
  }
  button, input { font-family: inherit; }
  .mono { font-family: "IBM Plex Mono","Cascadia Mono",monospace; }
  .num { font-variant-numeric: tabular-nums; }
  button { cursor: pointer; border: none; background: none; color: inherit; }
  input:focus { outline: none; border-color: var(--green) !important; }
  :focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; } }

  .phone { width: 100%; max-width: 430px; min-height: 100vh; background: var(--bg-base); display: flex; flex-direction: column; }
  @media (min-width: 431px) { .phone { min-height: 860px; margin: 24px 0; box-shadow: 0 20px 60px rgba(20,18,16,.35); border-radius: 20px; overflow: hidden; } }

  .topbar { height: 54px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--bg-surface); border-bottom: 1px solid var(--border-default); }
  .wordmark { font-size: 17px; font-weight: 600; color: var(--green); }
  .role-pill { font-size: 10.5px; font-weight: 500; padding: 3px 9px; border-radius: 999px; background: var(--green-tint); color: var(--green-dark); }
  .avatar { width: 30px; height: 30px; border-radius: 50%; background: var(--bg-sunken); color: var(--text-secondary); display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600; }

  .devbar { flex-shrink: 0; background: var(--bg-sunken); border-bottom: 1px solid var(--border-default); padding: 8px 12px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11px; color: var(--text-secondary); }
  .devbar b { color: var(--text-primary); }
  .devbtn { border: 1px solid var(--border-strong); border-radius: 999px; padding: 4px 10px; font-size: 11px; background: var(--bg-surface); color: var(--text-secondary); }
  .devbtn.active { background: var(--green); color: var(--on-green); border-color: var(--green); font-weight: 500; }

  .content { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 16px; }
  .h1 { font-size: 20px; line-height: 26px; font-weight: 600; margin: 0; }
  .h2 { font-size: 15.5px; line-height: 21px; font-weight: 500; margin: 0; }
  .body-sm { font-size: 13px; line-height: 18px; }
  .caption { font-size: 11px; line-height: 15px; }
  .text-secondary { color: var(--text-secondary); }
  .display { font-size: 30px; line-height: 36px; font-weight: 600; margin: 0; }

  .card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 8px; padding: 16px; }
  .card.tap { cursor: pointer; }
  .stack { display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .row.between { justify-content: space-between; }

  .btn { display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 14px; font-weight: 500; border-radius: 6px; padding: 11px 16px; min-height: 44px; width: 100%; }
  .btn-primary { background: var(--green); color: var(--on-green); }
  .btn-primary:disabled { background: var(--border-strong); color: var(--text-disabled); }
  .btn-ghost { background: transparent; color: var(--text-primary); border: 1px solid var(--border-default); }
  .btn-text { background: none; color: var(--green); font-size: 13px; font-weight: 500; padding: 4px 0; width: auto; }
  .btn-auto { width: auto; }
  .btn-sm { font-size: 12.5px; padding: 8px 12px; min-height: 38px; }

  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 12px; font-weight: 500; color: var(--text-secondary); }
  .field input { font-size: 14px; color: var(--text-primary); background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 6px; padding: 11px 12px; width: 100%; }
  .field input.err { border-color: var(--gap); }
  .field-err { font-size: 11px; color: var(--gap); }

  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; white-space: nowrap; }
  .chip-2565 { background: var(--cur-2565-tint); color: var(--cur-2565); }
  .chip-2570 { background: var(--cur-2570-tint); color: var(--cur-2570); }

  .badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; padding: 3px 10px; border-radius: 999px; font-weight: 500; }
  .badge-confirmed { border: 1.5px solid var(--green); color: var(--green); background: var(--green-tint); }
  .badge-draft { border: 1.5px dashed var(--draft); color: var(--draft); background: var(--draft-tint); }
  .badge-gap { border: 1.5px solid var(--gap); color: var(--gap); background: var(--gap-tint); }

  .bar { position: relative; height: 7px; border-radius: 999px; background: var(--bg-sunken); overflow: hidden; }
  .bar > span { position: absolute; inset: 0 auto 0 0; border-radius: 999px; background: var(--green); }
  .gapbanner { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; background: var(--gap-tint); border: 1px solid var(--gap); border-radius: 8px; }
  .gapbanner .dot { width: 7px; height: 7px; border-radius: 999px; background: var(--gap); margin-top: 6px; flex-shrink: 0; }

  .tabbar { flex-shrink: 0; background: var(--bg-surface); border-top: 1px solid var(--border-default); display: flex; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 10px; color: var(--text-secondary); min-height: 56px; }
  .tab.active { color: var(--green); }
  .tab svg { width: 19px; height: 19px; }

  .locked-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid var(--border-default); border-radius: 8px; background: var(--bg-surface); font-size: 13px; opacity: .45; }

  table.grid { border-collapse: collapse; width: 100%; }
  table.grid th, table.grid td { border: 1px solid var(--border-default); text-align: center; padding: 6px 4px; font-size: 11px; }
  table.grid th { background: var(--bg-sunken); color: var(--text-secondary); font-weight: 500; }
  table.grid td.hit { background: var(--green-tint); color: var(--green-dark); font-weight: 600; }
  table.grid td.empty { background: var(--bg-sunken); color: var(--text-disabled); }
  .gridwrap { overflow-x: auto; }

  .modal-backdrop { position: fixed; inset: 0; background: rgba(20,18,16,.4); display: none; align-items: flex-end; justify-content: center; z-index: 30; }
  .modal-backdrop.open { display: flex; }
  .modal-backdrop.open .phone { position: relative; }
  .sheet { background: var(--bg-surface); border-radius: 16px 16px 0 0; padding: 20px 16px; width: 100%; max-width: 430px; display: flex; flex-direction: column; gap: 14px; }

  .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: var(--green); color: var(--on-green); padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s ease; z-index: 40; pointer-events: none; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>

<div class="phone" id="phone">

  <div class="topbar">
    <div class="wordmark">ALIGN</div>
    <div class="row">
      <span class="role-pill" id="rolePill">Instructor</span>
      <div class="avatar" id="avatarInit">?</div>
    </div>
  </div>

  <div class="devbar">
    <b>สาธิต:</b>
    <button class="devbtn" id="devInstr" onclick="setRole('instructor')">อาจารย์ผู้สอน</button>
    <button class="devbtn" id="devAdmin" onclick="setRole('admin')">ผู้บริหารหลักสูตร</button>
    <button class="devbtn" onclick="demoSignupFlow()" title="ทดสอบขั้นตอนสมัครสมาชิก/รออนุมัติ (AB-24 ถึง AB-27) แยกต่างหาก">ทดสอบขั้นตอนสมัคร/อนุมัติ</button>
    <span style="margin-left:auto;color:var(--text-secondary);">บัญชี: <b id="devStatus">อนุมัติแล้ว</b></span>
  </div>

  <div class="content" id="content"></div>

  <div class="tabbar" id="tabbar"></div>
</div>

<div class="modal-backdrop" id="exportModal">
  <div class="sheet" id="exportSheet"></div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ---------------- shared state ---------------- */
const S = {
  role: 'instructor',
  accountStatus: 'approved',  // [โหมดทดสอบ] เริ่มต้นอนุมัติแล้วเพื่อข้ามขั้นตอนสมัคร/รออนุมัติ — กดปุ่ม "ทดสอบขั้นตอนสมัคร/อนุมัติ" ในแถบสาธิตเพื่อดู flow นี้แยกต่างหาก (ระบบจริงต้องเริ่มที่ 'none' เสมอตามกฎทางธุรกิจ #6)
  screen: 'dashboard',
  signup: { name:'', email:'', pw:'', pw2:'', touched:false },
  pendingAccounts: [
    { id:1, name:'อ.กมลชนก พรหมมา', email:'kamonchanok.p@university.ac.th' }
  ],
  handledAccounts: [],
  currentCourseId: '127121',
  newCourse: null,      // {name, cur} while adding a course
  newClo: null,         // {desc, plo:[]} while adding a CLO
  newSyllabus: null,    // {week, topic} while adding a syllabus row
  newRecord: null,      // draft teaching-record form
  editingMatch: null,   // id of the AI match currently being %-edited
  adminPloTab: '2565',
  newPlo: { '2565': null, '2570': null }
};

function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2200); }

function setRole(role){
  S.role = role;
  document.getElementById('devInstr').classList.toggle('active', role==='instructor');
  document.getElementById('devAdmin').classList.toggle('active', role==='admin');
  document.getElementById('rolePill').textContent = role==='instructor' ? 'Instructor' : 'Program Admin';
  document.getElementById('avatarInit').textContent = role==='instructor' ? 'สช' : 'สพ';
  if (role === 'instructor') {
    S.screen = S.accountStatus === 'approved' ? 'dashboard' : (S.accountStatus === 'none' ? 'signup' : 'pending');
  } else {
    S.screen = 'admin-dashboard';
  }
  render();
}

function demoSignupFlow(){ S.accountStatus='none'; S.signup={ name:'', email:'', pw:'', pw2:'', touched:false }; setRole('instructor'); }
function goto(screen){ S.screen = screen; render(); window.scrollTo(0,0); }
function openExport(){
  const c = course();
  const confirmed = c.matches.filter(m=>m.state==='confirmed');
  const cloCodes = [...new Set(confirmed.map(m=>m.cloCode))];
  document.getElementById('exportSheet').innerHTML = `
    <div class="row between"><div class="h2">ออกเอกสาร Word — ${c.name} <span class="chip chip-${c.cur}" style="margin-left:4px;">${c.cur}</span></div><button onclick="closeExport()" style="font-size:18px;">×</button></div>
    <div class="body-sm text-secondary">CLO/PLO ที่ยืนยันแล้ว ${cloCodes.length} ข้อ (${cloCodes.join(', ')||'ไม่มี'}) · ความสอดคล้องรวม ${coveragePct(c)}%</div>
    <div class="body-sm text-secondary">รวมส่วน Area of Improvement เสมอ</div>
    <button class="btn btn-primary" onclick="doExport()">ดาวน์โหลดเอกสาร Word</button>
    <div class="caption text-secondary">เอกสารอ้างอิงเฉพาะข้อมูลและหลักฐานที่ยืนยันแล้วในระบบเท่านั้น</div>
  `;
  document.getElementById('exportModal').classList.add('open');
}
function closeExport(){ document.getElementById('exportModal').classList.remove('open'); }
function doExport(){ closeExport(); toast('ดาวน์โหลดเอกสาร Word แล้ว'); }

/* ---------------- icons ---------------- */
const ICON = {
  home:'<path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/>',
  courses:'<path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 18.5z"/><path d="M5 17.5C5 16.7 5.7 16 6.5 16H19"/>',
  grid:'<rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/>',
  settings:'<line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/>',
  doc:'<path d="M14 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/>',
  shield:'<path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/>',
  account:'<path d="M8 8.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/><path d="M4.5 19c0-3 3.5-5 7-5s7 2 7 5"/><path d="M15.5 10.5l1.5 1.5 3-3"/>'
};
function svg(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">${ICON[name]}</svg>`; }

/* ---------------- tab bars ---------------- */
function tabbarInstructor(active){
  const tabs = [['dashboard','home','หน้าแรก'],['courses','courses','รายวิชา'],['cloweek','grid','CLO×สัปดาห์']];
  return tabs.map(([id,icon,label]) => `<div class="tab ${active===id?'active':''}" onclick="goto('${id}')">${svg(icon)}<span>${label}</span></div>`).join('');
}
function tabbarAdmin(active){
  const tabs = [['admin-dashboard','grid','หลักสูตร'],['admin-coursestatus','courses','รายวิชา'],['admin-plosetup','settings','ตั้งค่า'],['admin-sar','doc','SAR'],['admin-accesslog','shield','Log'],['admin-approve','account','บัญชี']];
  return tabs.map(([id,icon,label]) => `<div class="tab ${active===id?'active':''}" onclick="goto('${id}')">${svg(icon)}<span>${label}</span></div>`).join('');
}

/* ---------------- SCREENS: onboarding ---------------- */
function screenSignup(){
  const f = S.signup;
  const emailErr = f.touched && !/^\S+@\S+\.\S+$/.test(f.email);
  const pwMismatch = f.touched && f.pw2 && f.pw !== f.pw2;
  const filled = f.name.trim() && f.email.trim() && f.pw.length>=6 && f.pw2.length>=6;
  const disable = !(filled && !emailErr && !pwMismatch);
  document.getElementById('tabbar').innerHTML = '';
  return `
    <div><div class="h1">สมัครใช้งาน ALIGN</div><div class="body-sm text-secondary" style="margin-top:4px;">สำหรับอาจารย์ผู้สอน — บัญชีต้องรอผู้บริหารหลักสูตรอนุมัติก่อนใช้งานจริง</div></div>
    <div class="stack">
      <div class="field"><label>ชื่อ-นามสกุล</label><input id="f-signup-name" type="text" value="${f.name}" placeholder="เช่น นายสมชาย ใจดี" oninput="S.signup.name=this.value;render()"></div>
      <div class="field"><label>อีเมลสถาบัน</label><input id="f-signup-email" type="text" class="${emailErr?'err':''}" value="${f.email}" placeholder="name@university.ac.th" oninput="S.signup.email=this.value;S.signup.touched=true;render()">${emailErr?'<span class="field-err">กรุณากรอกอีเมลสถาบันให้ถูกต้อง</span>':''}</div>
      <div class="field"><label>รหัสผ่าน</label><input id="f-signup-pw" type="password" value="${f.pw}" oninput="S.signup.pw=this.value;render()"></div>
      <div class="field"><label>ยืนยันรหัสผ่าน</label><input id="f-signup-pw2" type="password" class="${pwMismatch?'err':''}" value="${f.pw2}" oninput="S.signup.pw2=this.value;S.signup.touched=true;render()">${pwMismatch?'<span class="field-err">รหัสผ่านไม่ตรงกัน</span>':''}</div>
    </div>
    <button class="btn btn-primary" ${disable?'disabled':''} onclick="submitSignup()">สมัครสมาชิก</button>
  `;
}
function submitSignup(){
  S.accountStatus = 'pending';
  S.pendingAccounts.push({ id: Date.now(), name: S.signup.name, email: S.signup.email });
  document.getElementById('devStatus').textContent = 'รออนุมัติ';
  goto('pending');
}
function screenPending(){
  document.getElementById('tabbar').innerHTML = '';
  const st = S.accountStatus;
  const map = {
    pending: { icon:'circle', color:'var(--draft)', badge:'badge-draft', label:'รออนุมัติ', title:'บัญชีของคุณอยู่ระหว่างตรวจสอบ', body:'ผู้บริหารหลักสูตรกำลังตรวจสอบคำขอสมัครของคุณ (สลับไปมุมมอง "ผู้บริหารหลักสูตร" ด้านบนเพื่อลองอนุมัติดูได้) — ระหว่างนี้ยังไม่สามารถเข้าถึงฟีเจอร์อื่นของระบบได้' },
    rejected: { icon:'x', color:'var(--gap)', badge:'badge-gap', label:'ถูกปฏิเสธ', title:'คำขอสมัครไม่ได้รับการอนุมัติ', body:'กรุณาติดต่อผู้บริหารหลักสูตรของท่านเพื่อสอบถามรายละเอียด' }
  }[st] || {};
  return `
    <div class="stack" style="align-items:center;text-align:center;padding-top:24px;">
      <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="${map.color}" stroke-width="1.5"><circle cx="12" cy="12" r="9.5"/>${st==='pending'?'<path d="M12 7v5l3 2"/>':'<path d="M9 9l6 6M15 9l-6 6"/>'}</svg>
      <span class="badge ${map.badge}">${map.label}</span>
      <div class="h1">${map.title}</div>
      <div class="body-sm text-secondary">${map.body}</div>
      ${st==='rejected' ? '<button class="btn btn-ghost" onclick="S.accountStatus=\'none\';S.screen=\'signup\';render()">สมัครสมาชิกใหม่</button>' : ''}
    </div>
    <div class="stack">
      <div class="locked-row">${svg('settings')} ตั้งค่ารายวิชา (CLO/PLO)</div>
      <div class="locked-row">${svg('doc')} บันทึกการสอน</div>
      <div class="locked-row">${svg('grid')} แดชบอร์ดและฟีเจอร์อื่น</div>
    </div>
    <div class="caption text-secondary" style="text-align:center;">ฟีเจอร์ทั้งหมดถูกล็อกจนกว่าบัญชีจะได้รับการอนุมัติ (กฎทางธุรกิจ #6)</div>
  `;
}

/* ---------------- SCREENS: instructor ---------------- */
const PLO = {
  '2565': [

function chip(cur){ return `<span class="chip chip-${cur}">${cur}</span>`; }
function course(){ return S.courses.find(c=>c.id===S.currentCourseId); }
function coveragePct(c){
  if(!c.clos.length) return 0;
  const confirmedSet = new Set(c.matches.filter(m=>m.state==='confirmed').map(m=>m.cloCode));
  return Math.round(confirmedSet.size / c.clos.length * 100);
}
function courseReady(c){ return c.clos.length > 0; }
function computeGap(c){
  const recordWeeks = new Set(c.matches.map(m=>m.week));
  const syllabusWeeks = new Set(c.syllabus.map(s=>s.week));
  return {
    missing: c.syllabus.filter(s=>!recordWeeks.has(s.week)),
    extra: c.matches.filter(m=>!syllabusWeeks.has(m.week))
  };
}

function screenDashboard(){
  document.getElementById('tabbar').innerHTML = tabbarInstructor('dashboard');
  const totalClos = S.courses.reduce((n,c)=>n+c.clos.length,0);
  const confirmedClos = S.courses.reduce((n,c)=>n+new Set(c.matches.filter(m=>m.state==='confirmed').map(m=>m.cloCode)).size,0);
  const overallPct = totalClos ? Math.round(confirmedClos/totalClos*100) : 0;
  let gapInfo = null;
  for(const c of S.courses){
    const missing = c.clos.find(cl=>!c.matches.some(m=>m.cloCode===cl.code && m.state==='confirmed'));
    if(missing){ gapInfo = {c, cl:missing}; break; }
  }
  return `
    <div><div class="h1">สวัสดี, สมชาย</div><div class="caption text-secondary">ภาพรวมความสอดคล้อง CLO/PLO ภาคการศึกษานี้</div></div>
    <div class="card"><div class="display">${overallPct}%</div><div class="caption text-secondary">ความสอดคล้องรวม (ยืนยันแล้วเท่านั้น) · CLO ${confirmedClos}/${totalClos} ข้อ ทุกวิชา</div></div>
    <div class="stack">
      <div class="h2">รายวิชาที่สอน</div>
      ${S.courses.map(c=>{ const pct = coveragePct(c); const ready = courseReady(c); return `
        <div class="card tap stack" onclick="S.currentCourseId='${c.id}';goto('summary')">
          <div class="row between">${chip(c.cur)}<span class="h2" style="flex:1;">${c.name}</span></div>
          <div class="row"><div class="bar" style="flex:1;"><span style="width:${pct}%"></span></div><span class="body-sm mono">${pct}%</span></div>
          <span class="badge ${ready?'badge-confirmed':'badge-draft'}" style="align-self:flex-start;">${ready?'พร้อมบันทึกการสอน':'ยังตั้งค่าไม่ครบ'}</span>
        </div>`;}).join('')}
    </div>
    ${gapInfo ? `<div class="gapbanner"><span class="dot"></span><div class="body-sm" style="flex:1;"><b>${gapInfo.cl.code}</b> (${gapInfo.c.name} ${chip(gapInfo.c.cur)}) — ยังไม่มีข้อมูลการสอนรองรับ</div></div>` : ''}
    <button class="btn btn-ghost" onclick="S.currentCourseId='${S.courses[0].id}';goto('record')">บันทึกการสอน</button>
  `;
}

function saveCourse(){

  if(!n.name.trim()){ toast('กรุณากรอกชื่อวิชา'); return; }
  S.courses.push({ id:'C'+Date.now(), name:n.name.trim(), cur:n.cur, clos:[], syllabus:[], matches:[] });
  S.newCourse = null;
  toast('เพิ่มรายวิชาแล้ว');

}

function toggleNewCloPlo(code){
  const i = S.newClo.plo.indexOf(code);
  if(i>=0) S.newClo.plo.splice(i,1); else S.newClo.plo.push(code);
  render();
}
function saveClo(){
  const n = S.newClo;
  if(!n.desc.trim()){ toast('กรุณากรอกคำอธิบาย CLO'); return; }
  if(n.plo.length===0){ toast('ต้องผูกกับ PLO อย่างน้อย 1 ข้อ (กฎทางธุรกิจ #1)'); return; }
  const c = course();
  c.clos.push({ code:'CLO'+(c.clos.length+1), desc:n.desc.trim(), plo:[...n.plo] });
  S.newClo = null;
  toast('เพิ่ม CLO แล้ว');
  render();
}

function removeSyllabusRow(i){ course().syllabus.splice(i,1); render(); }
function saveSyllabusRow(){
  const n = S.newSyllabus;
  if(!n.topic.trim()){ toast('กรุณากรอกหัวข้อ'); return; }
  const c = course();
  c.syllabus.push({ week: parseInt(n.week)||1, topic: n.topic.trim() });
  c.syllabus.sort((a,b)=>a.week-b.week);
  S.newSyllabus = null;
  toast('เพิ่มหัวข้อ syllabus แล้ว');
  render();
}

  if(!S.newRecord) S.newRecord = { cloCode:c.clos[0].code, week:1, topic:'', date:new Date().toISOString().slice(0,10), evidence:[], evName:'' };
  const r = S.newRecord;
  return `
    <div class="h1">บันทึกการสอน</div>
    <div class="caption text-secondary">${c.name} ${chip(c.cur)}</div>
    <div class="stack">
      <div class="field"><label>CLO ที่เกี่ยวข้อง</label>
        <select style="font-size:14px;color:var(--text-primary);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:6px;padding:11px 12px;" onchange="S.newRecord.cloCode=this.value">
          ${c.clos.map(cl=>`<option value="${cl.code}" ${r.cloCode===cl.code?'selected':''}>${cl.code} — ${cl.desc.slice(0,36)}${cl.desc.length>36?'…':''}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>สัปดาห์ที่สอน</label><input type="number" min="1" max="16" value="${r.week}" class="mono" style="max-width:90px;" oninput="S.newRecord.week=this.value"></div>
      <div class="field"><label>หัวข้อการสอน</label><input type="text" value="${r.topic}" placeholder="เช่น Workshop ตรวจสอบข่าวปลอม" oninput="S.newRecord.topic=this.value"></div>
      <div class="field"><label>วันที่สอนจริง</label><input type="date" value="${r.date}" oninput="S.newRecord.date=this.value"></div>
      <div class="field"><label>หลักฐาน/ชิ้นงาน</label>
        ${r.evidence.map((f,i)=>`<div class="card row between" style="padding:10px 12px;"><span class="body-sm">${f}</span><button onclick="removeEvidence(${i})" style="color:var(--gap);font-size:16px;">×</button></div>`).join('')}
        <div class="row" style="gap:8px;">
          <input type="text" value="${r.evName||''}" placeholder="ชื่อไฟล์ เช่น ภาพกิจกรรม.jpg" style="flex:1;" oninput="S.newRecord.evName=this.value">
          <button class="btn btn-ghost btn-sm btn-auto" onclick="addEvidence()">แนบ</button>
        </div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="submitRecord()">บันทึกและให้ AI ประมวลผล</button>
  `;
}
function addEvidence(){
  const r = S.newRecord;
  if(!r.evName || !r.evName.trim()){ toast('กรุณากรอกชื่อไฟล์'); return; }
  r.evidence.push(r.evName.trim());
  r.evName = '';
  render();
}
function removeEvidence(i){ S.newRecord.evidence.splice(i,1); render(); }
function submitRecord(){
  const c = course();
  const r = S.newRecord;
  if(!r.topic.trim()){ toast('กรุณากรอกหัวข้อการสอน'); return; }
  const pct = 35 + Math.round(Math.random()*35);
  c.matches.push({ id: Date.now(), cloCode: r.cloCode, week: parseInt(r.week)||1, topic: r.topic.trim(), pct, state:'draft' });
  S.newRecord = null;
  toast('บันทึกแล้ว — ส่งให้ AI ประมวลผล');
  goto('review');
}
function screenReview(){
  document.getElementById('tabbar').innerHTML = tabbarInstructor('courses');
  const c = course();
  const drafts = c.matches.filter(m=>m.state==='draft');
  const confirmed = c.matches.filter(m=>m.state==='confirmed');
  const gap = computeGap(c);
  return `
    <div><div class="h1">ตรวจสอบผล AI</div><div class="caption text-secondary">${c.name} ${chip(c.cur)} — ต้องยืนยันก่อนถือเป็นข้อมูลจริง</div></div>
    <div class="h2">ผลจับคู่ CLO/PLO</div>
    ${confirmed.length===0 && drafts.length===0 ? '<div class="card body-sm text-secondary">ยังไม่มีบันทึกการสอน</div>' : ''}
    ${confirmed.map(m=>`
      <div class="card stack" style="border:1.5px solid var(--green);background:var(--bg-surface);">
        <div class="row between"><span class="mono chip" style="background:var(--bg-sunken);">${m.cloCode}</span><span class="badge badge-confirmed">ยืนยันแล้ว</span></div>
        <div class="body-sm">จาก "${m.topic}" (week ${m.week}) · ${m.pct}%</div>
      </div>`).join('')}
    ${drafts.map(m=>`
      <div class="card stack" style="border:1.5px dashed var(--draft);background:var(--draft-tint);">
        <div class="row between"><span class="mono chip" style="background:var(--bg-sunken);">${m.cloCode}</span><span class="badge badge-draft">ผลจาก AI — ยังไม่ยืนยัน</span></div>
        <div class="body-sm">จาก "${m.topic}" (week ${m.week})</div>
        <div class="row"><div class="bar" style="width:100px;"><span style="width:${m.pct}%;background:var(--draft);"></span></div>${S.editingMatch===m.id ? `<input type="number" min="0" max="100" value="${m.pct}" class="mono" style="max-width:70px;" oninput="updateMatchPct(${m.id},this.value)">` : `<span class="body-sm mono">${m.pct}%</span>`}<span class="caption text-secondary">ความมั่นใจของ AI</span></div>
        <div class="row" style="gap:8px;">
          <button class="btn btn-primary btn-sm btn-auto" onclick="decideMatch(${m.id},'confirmed')">ยืนยัน</button>
          <button class="btn btn-ghost btn-sm btn-auto" onclick="toggleEditMatch(${m.id})">${S.editingMatch===m.id?'เสร็จแล้ว':'แก้ไข'}</button>
          <button class="btn btn-ghost btn-sm btn-auto" onclick="decideMatch(${m.id},'rejected')">ปฏิเสธ</button>
        </div>
      </div>`).join('')}
    <div class="h2">Gap เทียบ Course Syllabus</div>
    <div class="card stack" style="border:1.5px dashed var(--draft);background:var(--draft-tint);">
      <div class="row between"><span class="body-sm">หัวข้อที่ยังไม่พบการสอนรองรับ</span><span class="badge badge-draft">ยังไม่ยืนยัน</span></div>
      <div class="body-sm">${gap.missing.length ? gap.missing.map(g=>`week ${g.week} — ${g.topic}`).join(' · ') : 'ไม่มี — สอนครบตามแผนแล้ว'}</div>
    </div>
    <button class="btn btn-ghost" onclick="goto('cloweek')">ไปแผนที่ CLO × สัปดาห์</button>
  `;
}
function toggleEditMatch(id){ S.editingMatch = S.editingMatch===id ? null : id; render(); }
function updateMatchPct(id, val){
  const m = course().matches.find(x=>x.id===id);
  if(m) m.pct = Math.max(0, Math.min(100, parseInt(val)||0));
}
function decideMatch(id, state){
  const m = course().matches.find(x=>x.id===id);
  if(!m) return;
  m.state = state;
  S.editingMatch = null;
  toast(state==='confirmed' ? `ยืนยันผล ${m.cloCode} แล้ว` : `ปฏิเสธผล ${m.cloCode} แล้ว`);
  render();
}
function screenCloWeek(){
  document.getElementById('tabbar').innerHTML = tabbarInstructor('cloweek');
  const c = course();
  const weeks = Array.from({length:15},(_,i)=>i+1);
  const hits = {};
  c.clos.forEach(cl=>hits[cl.code]=[]);
  c.matches.filter(m=>m.state==='confirmed').forEach(m=>{ if(hits[m.cloCode]) hits[m.cloCode].push(m.week); });
  return `
    <div class="row between"><div class="h1">CLO × สัปดาห์</div></div>
    <div class="caption text-secondary">${c.name} ${chip(c.cur)}</div>
    ${c.clos.length===0 ? '<div class="card body-sm text-secondary">ยังไม่มี CLO</div>' : `
    <div class="gridwrap"><table class="grid"><thead><tr><th>CLO</th>${weeks.map(w=>`<th>${w}</th>`).join('')}</tr></thead><tbody>
      ${Object.entries(hits).map(([clo,hw])=>`<tr><td class="mono" style="text-align:left;">${clo}</td>${weeks.map(w=>`<td class="${hw.includes(w)?'hit':'empty'}">${hw.includes(w)?'1':'–'}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>`}
    <div class="caption text-secondary">คำนวณจากผลจับคู่ CLO/PLO ที่ยืนยันแล้วเท่านั้น (ไม่รวม draft)</div>
    <button class="btn btn-ghost" onclick="goto('summary')">ไปสรุปรายวิชา</button>
  `;
}
function screenSummary(){
  document.getElementById('tabbar').innerHTML = tabbarInstructor('dashboard');
  const c = course();
  const pct = coveragePct(c);
  const draftCount = c.matches.filter(m=>m.state==='draft').length;
  const gapClos = c.clos.filter(cl=>!c.matches.some(m=>m.cloCode===cl.code && m.state==='confirmed'));
  return `
    <div class="row between"><div class="h1">สรุปรายวิชา</div><div class="display" style="font-size:22px;">${pct}%</div></div>
    <div class="caption text-secondary">${c.name} ${chip(c.cur)}</div>
    ${draftCount>0 ? `<div class="gapbanner" style="background:var(--draft-tint);border-color:var(--draft);"><span class="dot" style="background:var(--draft);"></span><div class="body-sm" style="flex:1;">มีผลจาก AI ที่ยังไม่ยืนยัน ${draftCount} รายการ <button class="btn-text" onclick="goto('review')" style="display:inline;">ไปตรวจสอบ</button></div></div>` : ''}
    ${c.clos.length===0 ? '<div class="card body-sm text-secondary">ยังไม่มี CLO</div>' : `
    <div class="stack">
      ${c.clos.map(cl=>{ const m = c.matches.find(x=>x.cloCode===cl.code && x.state==='confirmed'); return `<div class="card row between" ${m?'':'style="border-style:dashed;border-color:var(--gap);"'}><span class="mono chip" style="background:var(--bg-sunken);">${cl.code}</span><span class="body-sm" style="flex:1;margin:0 8px;">${m?`แมทช์แล้ว ${m.pct}%`:''}</span>${m?'':'<span class="badge badge-gap">ยังไม่มีหลักฐาน</span>'}</div>`; }).join('')}
    </div>`}
    <div class="h2">Area of Improvement</div>
    <div class="card body-sm">${gapClos.length ? gapClos.map(cl=>`${cl.code} ยังมีหลักฐานรองรับน้อย — พิจารณาเพิ่มกิจกรรม/ชิ้นงานที่เชื่อมโยงกับหัวข้อนี้ในรอบถัดไป`).join(' ') : 'ทุก CLO มีหลักฐานยืนยันครบแล้ว'}</div>
    <button class="btn btn-primary" onclick="openExport()">ออกเอกสาร Word</button>
  `;
}

/* ---------------- SCREENS: admin ---------------- */
function screenAdminDashboard(){
  document.getElementById('tabbar').innerHTML = tabbarAdmin('admin-dashboard');
  const list = S.courses.filter(c=>c.cur==='2565');
  const pcts = list.map(coveragePct);
  const avg = pcts.length ? Math.round(pcts.reduce((a,b)=>a+b,0)/pcts.length) : 0;
  return `
    <div class="h1">แดชบอร์ดภาพรวมหลักสูตร</div>
    <div class="card"><div class="display">${avg}%</div><div class="caption text-secondary">ความสอดคล้องเฉลี่ย · หลักสูตร 2565</div></div>
    <div class="h2">รายวิชาในกลุ่ม 2565</div>
    <div class="stack">
      ${list.map(c=>{ const p=coveragePct(c); return `<div class="card row between"><span class="body-sm" style="flex:1;">${c.name}</span><div class="bar" style="width:60px;"><span style="width:${p}%"></span></div><span class="body-sm mono">${p}%</span></div>`; }).join('')}
    </div>
  `;
}
function screenAdminCourseStatus(){
  document.getElementById('tabbar').innerHTML = tabbarAdmin('admin-coursestatus');
  const list = S.courses.filter(c=>c.cur==='2565');
  const readyCount = list.filter(courseReady).length;
  return `
    <div class="h1">ภาพรวมรายวิชา</div>
    <div class="card"><div class="h2">${readyCount}/${list.length}</div><div class="caption text-secondary">วิชาพร้อมใช้งานในกลุ่ม 2565</div></div>
    <div class="stack">
      ${list.map(c=>`<div class="card row between">${chip(c.cur)}<span class="body-sm" style="flex:1;margin-left:8px;">${c.name}</span><span class="badge ${courseReady(c)?'badge-confirmed':'badge-draft'}">${courseReady(c)?'พร้อม':'ไม่ครบ'}</span></div>`).join('')}
    </div>
  `;
}
function screenAdminPloSetup(){
  document.getElementById('tabbar').innerHTML = tabbarAdmin('admin-plosetup');
  const tab = S.adminPloTab;
  const list = PLO[tab];
  const adding = S.newPlo[tab];
  return `
    <div class="h1">ตั้งค่าหลักสูตร/PLO</div>
    <div class="row" style="border-bottom:1px solid var(--border-default);">
      <button class="btn-text" style="color:var(--cur-2565);${tab==='2565'?'font-weight:600;border-bottom:2px solid var(--cur-2565);':''}border-radius:0;padding-bottom:8px;" onclick="S.adminPloTab='2565';render()">หลักสูตร 2565</button>
      <button class="btn-text" style="color:var(--cur-2570);${tab==='2570'?'font-weight:600;border-bottom:2px solid var(--cur-2570);':''}padding-bottom:8px;" onclick="S.adminPloTab='2570';render()">หลักสูตร 2570</button>
    </div>
    <div class="stack">
      ${list.map((p,i)=>`<div class="card row between"><span class="body-sm" style="flex:1;"><span class="mono">${p.code}</span> — ${p.desc}</span><button onclick="removePlo('${tab}',${i})" style="color:var(--gap);font-size:16px;">×</button></div>`).join('')}
    </div>
    ${adding!==null ? `
      <div class="card stack">
        <div class="field"><label>คำอธิบาย PLO ใหม่ (จะได้รหัส PLO${list.length+1})</label><textarea style="min-height:60px;font-family:inherit;font-size:14px;color:var(--text-primary);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:6px;padding:11px 12px;" oninput="S.newPlo['${tab}']=this.value">${adding}</textarea></div>
        <div class="row" style="gap:8px;">
          <button class="btn btn-primary btn-sm btn-auto" onclick="savePlo('${tab}')">บันทึก</button>
          <button class="btn btn-ghost btn-sm btn-auto" onclick="S.newPlo['${tab}']=null;render()">ยกเลิก</button>
        </div>
      </div>` : `<button class="btn btn-ghost btn-auto btn-sm" style="align-self:flex-start;" onclick="S.newPlo['${tab}']='';render()">+ เพิ่ม PLO</button>`}
  `;
}
function removePlo(tab, i){ PLO[tab].splice(i,1); render(); }
function savePlo(tab){
  const desc = (S.newPlo[tab]||'').trim();
  if(!desc){ toast('กรุณากรอกคำอธิบาย PLO'); return; }
  PLO[tab].push({ code:'PLO'+(PLO[tab].length+1), desc });
  S.newPlo[tab] = null;
  toast('เพิ่ม PLO แล้ว');
  render();
}
function screenAdminSar(){
  document.getElementById('tabbar').innerHTML = tabbarAdmin('admin-sar');
  const list = S.courses.filter(c=>c.cur==='2565');
  return `
    <div class="h1">เอกสาร SAR</div>
    <div class="caption text-secondary">QA ไม่มีสิทธิ์เข้าระบบ ALIGN โดยตรง — ดาวน์โหลดแล้วส่งต่อภายนอกระบบ</div>
    <div class="stack">
      ${list.map(c=>`<div class="card row between">${chip(c.cur)}<span class="body-sm" style="flex:1;margin-left:8px;">${c.name}</span><button class="btn btn-ghost btn-sm btn-auto" onclick="toast('ดาวน์โหลดเอกสาร SAR ของ ${c.name} แล้ว')">ดาวน์โหลด</button></div>`).join('')}
    </div>
  `;
}
function screenAdminAccessLog(){
  document.getElementById('tabbar').innerHTML = tabbarAdmin('admin-accesslog');
  return `
    <div class="h1">ประวัติการเข้าถึงหลักฐาน</div>
    <div class="stack">
      <div class="card body-sm"><span class="mono caption">2026-08-18 09:12</span><br>อ.สมชาย ใจดี (Instructor) — ดู — 127121 การรู้เท่าทันสื่อดิจิทัล ${chip('2565')}</div>
      <div class="card body-sm"><span class="mono caption">2026-08-17 14:05</span><br>ผู้บริหารหลักสูตร — ดาวน์โหลด — 127121 การรู้เท่าทันสื่อดิจิทัล ${chip('2565')}</div>
    </div>
    <div class="caption text-secondary">ไม่แสดงชื่อไฟล์ในตาราง log นี้ตามข้อกำหนด PDPA</div>
  `;
}
function screenAdminApprove(){
  document.getElementById('tabbar').innerHTML = tabbarAdmin('admin-approve');
  const decide = (id, status) => {
    const item = S.pendingAccounts.find(p=>p.id===id);
    if(!item) return;
    S.pendingAccounts = S.pendingAccounts.filter(p=>p.id!==id);
    S.handledAccounts.unshift({ ...item, status, at:'เมื่อสักครู่' });
    if (S.signup.email && item.email === S.signup.email) {
      S.accountStatus = status;
      document.getElementById('devStatus').textContent = status==='approved' ? 'อนุมัติแล้ว' : 'ถูกปฏิเสธ';
    }
    render();
    toast(status==='approved' ? `อนุมัติ ${item.name} แล้ว` : `ปฏิเสธ ${item.name} แล้ว`);
  };
  window.__decide = decide;
  return `
    <div class="row between"><div class="h1">อนุมัติบัญชีผู้ใช้</div><span class="badge badge-confirmed" style="font-size:10px;">Admin only</span></div>
    <div class="h2">รออนุมัติ (${S.pendingAccounts.length})</div>
    <div class="stack">
      ${S.pendingAccounts.length===0 ? '<div class="caption text-secondary">ไม่มีคำขอที่รออนุมัติ</div>' : S.pendingAccounts.map(r=>`
        <div class="card stack">
          <div class="row between"><span class="h2">${r.name}</span><span class="badge badge-draft">รออนุมัติ</span></div>
          <div class="caption text-secondary">${r.email}</div>
          <div class="row" style="gap:8px;"><button class="btn btn-primary btn-sm" style="background:var(--green);color:var(--on-green);" onclick="__decide(${r.id},'approved')">อนุมัติ</button><button class="btn btn-sm" style="border:1.5px solid var(--gap);color:var(--gap);" onclick="__decide(${r.id},'rejected')">ปฏิเสธ</button></div>
        </div>`).join('')}
    </div>
    ${S.handledAccounts.length ? `<div class="h2">ดำเนินการแล้ว</div><div class="stack">${S.handledAccounts.map(h=>`<div class="card row between" style="opacity:.7;"><span class="body-sm" style="flex:1;">${h.name}</span><span class="badge ${h.status==='approved'?'badge-confirmed':'badge-gap'}">${h.status==='approved'?'อนุมัติแล้ว':'ถูกปฏิเสธ'}</span></div>`).join('')}</div>` : ''}
  `;
}

/* ---------------- router ---------------- */
const SCREENS = {
  signup: screenSignup, pending: screenPending,
  dashboard: screenDashboard, courses: screenCourses, cloplo: screenCloPlo, syllabus: screenSyllabus,
  record: screenRecord, review: screenReview, cloweek: screenCloWeek, summary: screenSummary,
  'admin-dashboard': screenAdminDashboard, 'admin-coursestatus': screenAdminCourseStatus,
  'admin-plosetup': screenAdminPloSetup, 'admin-sar': screenAdminSar,
  'admin-accesslog': screenAdminAccessLog, 'admin-approve': screenAdminApprove
};
function render(){
  const active = document.activeElement;
  let saved = null;
  if (active && active.id && active.id.indexOf('f-') === 0) {
    saved = { id: active.id, start: active.selectionStart, end: active.selectionEnd };
  }
  document.getElementById('content').innerHTML = (SCREENS[S.screen] || screenSignup)();
  if (saved) {
    const el = document.getElementById(saved.id);
    if (el) {
      el.focus();
      if (typeof el.setSelectionRange === 'function' && saved.start != null) {
        try { el.setSelectionRange(saved.start, saved.end); } catch(e) {}
      }
    }
  }
}
setRole('instructor');
</script>
