<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
  --border-default:#E2D9C8; --border-strong:#C9BBA0;
  --text-primary:#2B2620; --text-secondary:#6B6255; --text-disabled:#B3AA9A;
  --green:#5B6E4F; --green-tint:#E8ECE2;
  --draft:#B8863C; --draft-tint:#F3E6CE;
  --cur-2565:#A98F72; --cur-2565-tint:#F1E9DD;
  --cur-2570:#8A9A78; --cur-2570-tint:#EDF1E7;
}
*{box-sizing:border-box;} html,body{margin:0;}
body{background:var(--bg-base);color:var(--text-primary);font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;font-size:16px;line-height:24px;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
.mono{font-family:'IBM Plex Mono',monospace;}
.h1{font-size:24px;line-height:32px;font-weight:600;margin:0;}
.h3{font-size:16px;line-height:24px;font-weight:500;margin:0;}
.body-sm{font-size:14px;line-height:20px;}
.caption{font-size:12px;line-height:16px;}
.text-secondary{color:var(--text-secondary);}
.app-header{height:64px;background:var(--bg-surface);border-bottom:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
.wordmark{font-size:20px;line-height:28px;font-weight:600;color:var(--green);}
.role-badge{font-size:12px;line-height:16px;padding:2px 8px;border:1px solid var(--border-default);border-radius:4px;color:var(--text-secondary);}
.side-nav{width:216px;background:var(--bg-base);border-right:1px solid var(--border-default);flex-shrink:0;padding:16px 8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;font-size:14px;line-height:20px;color:var(--text-primary);}
.nav-item.active{background:var(--green-tint);color:var(--green);font-weight:500;}
.nav-item svg{flex-shrink:0;}
.content{flex:1;padding:32px;overflow:auto;}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:24px;}
.tab{padding:9px 16px;border-radius:4px 4px 0 0;font-size:14px;color:var(--text-secondary);border-bottom:2px solid transparent;}
.tab.tab-2565.active{color:var(--cur-2565);font-weight:500;border-bottom:2px solid var(--cur-2565);}
.tab.tab-2570.active{color:var(--cur-2570);font-weight:500;border-bottom:2px solid var(--cur-2570);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;padding:3px 8px;border-radius:4px;}
.chip-2565{background:var(--cur-2565-tint);color:var(--cur-2565);}
.chip-2570{background:var(--cur-2570-tint);color:var(--cur-2570);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;padding:3px 8px;border-radius:4px;}
.badge-confirmed{border:1.5px solid var(--green);color:var(--green);background:var(--bg-surface);}
.badge-draft{border:1.5px dashed var(--draft);color:var(--draft);background:var(--draft-tint);}
.row-card{border:1px solid var(--border-default);border-radius:8px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--bg-surface);}
</style>
</helmet>

<div style="display:flex;flex-direction:column;height:100%;min-height:800px;">
  <div class="app-header">
    <div class="wordmark">ALIGN</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="body-sm">ผศ.ดร. สุพจน์ ประสานงาน</span>
      <span class="role-badge">Program Administrator</span>
    </div>
  </div>
  <div style="display:flex;flex:1;min-height:0;">
    <div class="side-nav">
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
        <span>ภาพรวมหลักสูตร</span>
      </div>
      <div class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3M10 7h10M4 12h3M10 12h10M4 17h3M10 17h10"/></svg>
        <span>ภาพรวมรายวิชา</span>
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg>
        <span>ตั้งค่าหลักสูตร/PLO</span>
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>
        <span>เอกสาร SAR</span>
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/></svg>
        <span>ประวัติการเข้าถึงหลักฐาน</span>
      </div>
    </div>

    <div class="content">
      <div style="display:flex;flex-direction:column;gap:20px;max-width:780px;">

        <div class="h1">ภาพรวมรายวิชาแยกตามกลุ่มหลักสูตร</div>
        <div class="caption text-secondary">Map: AB-04</div>

        <div style="display:flex;gap:4px;border-bottom:1px solid var(--border-default);">
          <button class="tab tab-2565 {{tab2565Class}}" onClick="{{onTab2565}}">หลักสูตร 2565</button>
          <button class="tab tab-2570 {{tab2570Class}}" onClick="{{onTab2570}}">หลักสูตร 2570</button>
        </div>

        <div class="card" style="width:280px;">
          <div class="h3">{{readyCount}}/{{totalCount}}</div>
          <div class="caption text-secondary">วิชาพร้อมใช้งานในกลุ่มนี้</div>
        </div>

        <div style="display:flex;flex-direction:column;gap:10px;">
          <sc-for list="{{courses}}" as="c" hint-placeholder-count="3">
            <div class="row-card">
              <div style="display:flex;align-items:center;gap:12px;">
                <span class="body-sm">{{c.name}}</span>
                <span class="chip {{curChipClass}}">{{curLabel}}</span>
              </div>
              <div style="display:flex;align-items:center;gap:12px;">
                <span class="caption text-secondary">{{c.instructor}}</span>
                <span class="badge {{c.badgeClass}}">{{c.badgeLabel}}</span>
              </div>
            </div>
          </sc-for>
        </div>

      </div>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: '2570',
      courses2565: [
        { name: '125212 จิตวิทยาเพื่อการสื่อสาร', instructor: 'อ.ธนกร ใจดี', unbound: 0 },
        { name: '127311 ระเบียบวิธีวิจัย', instructor: 'อ.พิมพ์ชนก แสงทอง', unbound: 2 },
        { name: '127121 การรู้เท่าทันสื่อดิจิทัล', instructor: 'อ.ธนกร ใจดี', unbound: 0 }
      ],
      courses2570: [
        { name: '70127121 การรู้เท่าทันสื่อดิจิทัลและการตรวจสอบข้อเท็จจริง', instructor: 'อ.ธนกร ใจดี', unbound: 0 },
        { name: '70127211 การบริหารจัดการแพลตฟอร์มโซเชียลมีเดียและอัลกอริทึมศึกษา', instructor: 'อ.กิตติ เรืองวิทย์', unbound: 3 }
      ]
    };
  }
  renderVals() {
    const key = 'courses' + this.state.tab;
    const list = this.state[key];
    const courses = list.map((c) => ({
      name: c.name,
      instructor: c.instructor,
      badgeClass: c.unbound === 0 ? 'badge-confirmed' : 'badge-draft',
      badgeLabel: c.unbound === 0 ? 'พร้อมใช้งาน' : 'ยังไม่ครบ (' + c.unbound + ' CLO ยังไม่ผูก PLO)'
    }));
    return {
      tab2565Class: this.state.tab === '2565' ? 'active' : '',
      tab2570Class: this.state.tab === '2570' ? 'active' : '',
      curLabel: this.state.tab,
      curChipClass: this.state.tab === '2565' ? 'chip-2565' : 'chip-2570',
      courses,
      totalCount: list.length,
      readyCount: list.filter((c) => c.unbound === 0).length,
      onTab2565: () => this.setState({ tab: '2565' }),
      onTab2570: () => this.setState({ tab: '2570' })
    };
  }
}
</script>
</body>
</html>
