<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
  --border-default:#E2D9C8; --border-strong:#C9BBA0;
  --text-primary:#2B2620; --text-secondary:#6B6255;
  --green:#5B6E4F;
  --cur-2565:#A98F72; --cur-2565-tint:#F1E9DD;
  --cur-2570:#8A9A78; --cur-2570-tint:#EDF1E7;
}
*{box-sizing:border-box;} html,body{margin:0;}
body{background:var(--bg-sunken);color:var(--text-primary);font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;font-size:15px;line-height:22px;display:flex;justify-content:center;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
select,input[type=date]{font-family:inherit;font-size:12px;color:var(--text-primary);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:7px 6px;width:100%;}
.mono{font-family:'IBM Plex Mono',monospace;}
.m-shell{width:375px;min-height:812px;background:var(--bg-base);display:flex;flex-direction:column;}
.m-header{height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-default);}
.m-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.m-tabbar{flex-shrink:0;min-height:58px;background:var(--bg-surface);border-top:1px solid var(--border-default);display:flex;}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;color:var(--text-secondary);min-height:44px;}
.m-tab.active{color:var(--green);}
.h1{font-size:19px;line-height:25px;font-weight:600;margin:0;}
.caption{font-size:11px;line-height:15px;}
.text-secondary{color:var(--text-secondary);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:4px;}
.chip-2565{background:var(--cur-2565-tint);color:var(--cur-2565);}
.chip-2570{background:var(--cur-2570-tint);color:var(--cur-2570);}
.log-card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:4px;}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
</style>
</helmet>

<div class="m-shell">
  <div class="m-header"><div class="h1">ประวัติการเข้าถึงหลักฐาน</div></div>

  <div class="m-content">
    <div class="caption text-secondary">Map: AB-07 (ผู้บริหารหลักสูตร)</div>

    <div class="filter-grid">
      <select value="{{curFilter}}" onChange="{{onCurChange}}">
        <option value="all">ทุกกลุ่มหลักสูตร</option>
        <option value="2565">2565</option>
        <option value="2570">2570</option>
      </select>
      <select value="{{courseFilter}}" onChange="{{onCourseChange}}">
        <option value="all">ทุกรายวิชา</option>
        <sc-for list="{{courseOptions}}" as="co" hint-placeholder-count="3">
          <option value="{{co}}">{{co}}</option>
        </sc-for>
      </select>
      <input type="date" value="{{fromDate}}" onInput="{{onFromChange}}">
      <input type="date" value="{{toDate}}" onInput="{{onToChange}}">
    </div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div class="caption text-secondary">ไม่มี log ในช่วงที่กรอง</div>
    </sc-if>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="6">
        <div class="log-card">
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span class="mono caption">{{r.at}}</span>
            <span class="chip {{r.curClass}}">{{r.cur}}</span>
          </div>
          <div style="font-size:13px;">{{r.who}} <span class="caption text-secondary">({{r.role}})</span></div>
          <div style="display:flex;align-items:center;justify-content:space-between;">
            <span class="caption text-secondary">{{r.course}}</span>
            <span class="caption" style="font-weight:500;">{{r.action}}</span>
          </div>
        </div>
      </sc-for>
    </div>
  </div>

  <div class="m-tabbar">
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      <span>หลักสูตร</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3M10 7h10M4 12h3M10 12h10M4 17h3M10 17h10"/></svg>
      <span>รายวิชา</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg>
      <span>ตั้งค่า</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>
      <span>SAR</span>
    </div>
    <div class="m-tab active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/></svg>
      <span>Log</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/><path d="M4.5 19c0-3 3.5-5 7-5s7 2 7 5"/><path d="M15.5 10.5l1.5 1.5 3-3"/></svg>
      <span>บัญชี</span>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      curFilter: 'all', courseFilter: 'all',
      fromDate: '2026-06-01', toDate: '2026-08-20',
      log: [
        { at: '2026-08-18 09:12', who: 'อ.ธนกร ใจดี', role: 'Instructor', action: 'ดู', course: '127121 การรู้เท่าทันสื่อดิจิทัล', cur: '2565', date: '2026-08-18' },
        { at: '2026-08-17 14:05', who: 'ผศ.ดร. สุพจน์ ประสานงาน', role: 'Program Administrator', action: 'ดาวน์โหลด', course: '127121 การรู้เท่าทันสื่อดิจิทัล', cur: '2565', date: '2026-08-17' },
        { at: '2026-08-15 11:40', who: 'อ.ธนกร ใจดี', role: 'Instructor', action: 'ดู', course: '70127121 การรู้เท่าทันสื่อดิจิทัลและการตรวจสอบข้อเท็จจริง', cur: '2570', date: '2026-08-15' },
        { at: '2026-08-10 16:22', who: 'อ.พิมพ์ชนก แสงทอง', role: 'Instructor', action: 'ดาวน์โหลด', course: '125212 จิตวิทยาเพื่อการสื่อสาร', cur: '2565', date: '2026-08-10' },
        { at: '2026-07-30 10:03', who: 'ผศ.ดร. สุพจน์ ประสานงาน', role: 'Program Administrator', action: 'ดู', course: '125212 จิตวิทยาเพื่อการสื่อสาร', cur: '2565', date: '2026-07-30' },
        { at: '2026-07-22 08:55', who: 'อ.ธนกร ใจดี', role: 'Instructor', action: 'ดู', course: '127121 การรู้เท่าทันสื่อดิจิทัล', cur: '2565', date: '2026-07-22' }
      ]
    };
  }
  renderVals() {
    const courseOptions = Array.from(new Set(this.state.log.map((r) => r.course)));
    const filtered = this.state.log.filter((r) => {
      if (this.state.curFilter !== 'all' && r.cur !== this.state.curFilter) return false;
      if (this.state.courseFilter !== 'all' && r.course !== this.state.courseFilter) return false;
      if (this.state.fromDate && r.date < this.state.fromDate) return false;
      if (this.state.toDate && r.date > this.state.toDate) return false;
      return true;
    });
    const rows = filtered.map((r) => ({
      at: r.at, who: r.who, role: r.role, action: r.action, course: r.course, cur: r.cur,
      curClass: r.cur === '2565' ? 'chip-2565' : 'chip-2570'
    }));
    return {
      curFilter: this.state.curFilter, courseFilter: this.state.courseFilter,
      fromDate: this.state.fromDate, toDate: this.state.toDate,
      courseOptions, rows, isEmpty: rows.length === 0,
      onCurChange: (e) => this.setState({ curFilter: e.target.value }),
      onCourseChange: (e) => this.setState({ courseFilter: e.target.value }),
      onFromChange: (e) => this.setState({ fromDate: e.target.value }),
      onToChange: (e) => this.setState({ toDate: e.target.value })
    };
  }
}
</script>
</body>
</html>
