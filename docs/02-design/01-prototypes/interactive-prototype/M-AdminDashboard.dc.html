<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
  --border-default:#E2D9C8; --border-strong:#C9BBA0;
  --text-primary:#2B2620; --text-secondary:#6B6255;
  --green:#5B6E4F; --green-tint:#E8ECE2;
  --cur-2565:#A98F72; --cur-2565-tint:#F1E9DD;
  --cur-2570:#8A9A78; --cur-2570-tint:#EDF1E7;
}
*{box-sizing:border-box;} html,body{margin:0;}
body{background:var(--bg-sunken);color:var(--text-primary);font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;font-size:15px;line-height:22px;display:flex;justify-content:center;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
select{font-family:inherit;font-size:12px;color:var(--text-primary);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:6px 6px;}
.mono{font-family:'IBM Plex Mono',monospace;}
.m-shell{width:375px;min-height:812px;background:var(--bg-base);display:flex;flex-direction:column;}
.m-header{height:52px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-default);}
.wordmark-sm{font-size:16px;font-weight:600;color:var(--green);}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--green-tint);color:var(--green);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;}
.m-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.m-tabbar{flex-shrink:0;min-height:58px;background:var(--bg-surface);border-top:1px solid var(--border-default);display:flex;}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;color:var(--text-secondary);min-height:44px;}
.m-tab.active{color:var(--green);}
.h1{font-size:19px;line-height:25px;font-weight:600;margin:0;}
.h2{font-size:16px;line-height:22px;font-weight:500;margin:0;}
.body-sm{font-size:13px;line-height:18px;}
.caption{font-size:11px;line-height:15px;}
.text-secondary{color:var(--text-secondary);}
.display{font-size:26px;line-height:32px;font-weight:600;margin:0;}
.m-card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:16px;}
.tabrow{display:flex;background:var(--bg-sunken);border-radius:8px;padding:3px;gap:3px;}
.tabbtn{flex:1;padding:8px;border-radius:6px;font-size:13px;color:var(--text-secondary);min-height:38px;}
.tabbtn.tab-2565.active{background:var(--cur-2565-tint);color:var(--cur-2565);font-weight:500;}
.tabbtn.tab-2570.active{background:var(--cur-2570-tint);color:var(--cur-2570);font-weight:500;}
.scope-note{border:1px dashed var(--border-strong);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;background:var(--bg-sunken);}
.clo-row{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-bottom:1px solid var(--border-default);}
</style>
</helmet>

<div class="m-shell">
  <div class="m-header">
    <div class="wordmark-sm">ALIGN</div>
    <div class="avatar">สพ</div>
  </div>

  <div class="m-content">
    <div class="h1">แดชบอร์ดภาพรวมหลักสูตร</div>
    <div class="caption text-secondary">Map: AB-14</div>

    <div class="scope-note">
      <span class="caption text-secondary">สาธิต — program_admin_curriculum_scope</span>
      <select value="{{scope}}" onChange="{{onScopeChange}}">
        <option value="both">ทั้งสองกลุ่ม</option>
        <option value="2565">เฉพาะ 2565</option>
        <option value="2570">เฉพาะ 2570</option>
      </select>
    </div>

    <div class="tabrow">
      <sc-if value="{{show2565Tab}}" hint-placeholder-val="{{true}}">
        <button class="tabbtn tab-2565 {{tab2565Class}}" onClick="{{onTab2565}}">2565</button>
      </sc-if>
      <sc-if value="{{show2570Tab}}" hint-placeholder-val="{{true}}">
        <button class="tabbtn tab-2570 {{tab2570Class}}" onClick="{{onTab2570}}">2570</button>
      </sc-if>
    </div>

    <sc-if value="{{noAccess}}" hint-placeholder-val="{{false}}">
      <div class="body-sm text-secondary">ไม่มีกลุ่มหลักสูตรที่อยู่ในสิทธิ์การดูแลของผู้ใช้นี้</div>
    </sc-if>

    <sc-if value="{{hasAccess}}" hint-placeholder-val="{{true}}">
      <div class="m-card" style="width:150px;display:flex;flex-direction:column;gap:2px;">
        <div class="display">{{avgPct}}%</div>
        <div class="caption text-secondary">เฉลี่ย {{curLabel}} · ยืนยันแล้ว</div>
      </div>

      <div>
        <div class="h2" style="margin-bottom:4px;">รายวิชาในกลุ่มนี้</div>
        <sc-for list="{{courses}}" as="c" hint-placeholder-count="3">
          <div class="clo-row">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span class="body-sm">{{c.name}}</span>
              <span class="mono body-sm">{{c.pct}}%</span>
            </div>
            <div class="caption text-secondary">CLO ไม่มีหลักฐาน: {{c.missing}}</div>
          </div>
        </sc-for>
      </div>
    </sc-if>
  </div>

  <div class="m-tabbar">
    <div class="m-tab active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      <span>หลักสูตร</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3M10 7h10M4 12h3M10 12h10M4 17h3M10 17h10"/></svg>
      <span>รายวิชา</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg>
      <span>ตั้งค่า</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>
      <span>SAR</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/></svg>
      <span>Log</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/><path d="M4.5 19c0-3 3.5-5 7-5s7 2 7 5"/><path d="M15.5 10.5l1.5 1.5 3-3"/></svg>
      <span>บัญชี</span>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      scope: 'both', tab: '2570',
      data: {
        '2565': { avg: 54, courses: [
          { name: 'หลักการออกแบบส่วนติดต่อผู้ใช้', pct: 58, missing: 1 },
          { name: 'ระบบปฏิบัติการ', pct: 50, missing: 2 }
        ] },
        '2570': { avg: 63, courses: [
          { name: 'การเขียนโปรแกรมเชิงวัตถุ', pct: 72, missing: 0 },
          { name: 'ระบบฐานข้อมูล', pct: 59, missing: 1 },
          { name: 'ปัญญาประดิษฐ์เบื้องต้น', pct: 0, missing: 4 }
        ] }
      }
    };
  }
  renderVals() {
    const show2565 = this.state.scope === 'both' || this.state.scope === '2565';
    const show2570 = this.state.scope === 'both' || this.state.scope === '2570';
    let tab = this.state.tab;
    if (tab === '2565' && !show2565) tab = '2570';
    if (tab === '2570' && !show2570) tab = '2565';
    const hasAccess = show2565 || show2570;
    const d = hasAccess ? this.state.data[tab] : null;
    return {
      scope: this.state.scope,
      show2565Tab: show2565, show2570Tab: show2570,
      tab2565Class: tab === '2565' ? 'active' : '',
      tab2570Class: tab === '2570' ? 'active' : '',
      curLabel: tab, noAccess: !hasAccess, hasAccess,
      avgPct: d ? d.avg : 0, courses: d ? d.courses : [],
      onScopeChange: (e) => this.setState({ scope: e.target.value }),
      onTab2565: () => this.setState({ tab: '2565' }),
      onTab2570: () => this.setState({ tab: '2570' })
    };
  }
}
</script>
</body>
</html>
