<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
  --border-default:#E2D9C8; --border-strong:#C9BBA0;
  --text-primary:#2B2620; --text-secondary:#6B6255;
  --green:#5B6E4F;
  --cur-2565:#A98F72; --cur-2565-tint:#F1E9DD;
  --cur-2570:#8A9A78; --cur-2570-tint:#EDF1E7;
}
*{box-sizing:border-box;} html,body{margin:0;}
body{background:var(--bg-sunken);color:var(--text-primary);font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;font-size:15px;line-height:22px;display:flex;justify-content:center;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input{font-family:inherit;font-size:14px;color:var(--text-primary);}
.mono{font-family:'IBM Plex Mono',monospace;}
.m-shell{width:375px;min-height:812px;background:var(--bg-base);display:flex;flex-direction:column;}
.m-header{height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-default);}
.m-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.m-tabbar{flex-shrink:0;min-height:58px;background:var(--bg-surface);border-top:1px solid var(--border-default);display:flex;}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;color:var(--text-secondary);min-height:44px;}
.m-tab.active{color:var(--green);}
.h1{font-size:19px;line-height:25px;font-weight:600;margin:0;}
.body-sm{font-size:13px;line-height:18px;}
.caption{font-size:11px;line-height:15px;}
.text-secondary{color:var(--text-secondary);}
.tabrow{display:flex;background:var(--bg-sunken);border-radius:8px;padding:3px;gap:3px;}
.tabbtn{flex:1;padding:8px;border-radius:6px;font-size:13px;color:var(--text-secondary);min-height:38px;}
.tabbtn.tab-2565.active{background:var(--cur-2565-tint);color:var(--cur-2565);font-weight:500;}
.tabbtn.tab-2570.active{background:var(--cur-2570-tint);color:var(--cur-2570);font-weight:500;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:4px;}
.chip-2565{background:var(--cur-2565-tint);color:var(--cur-2565);}
.chip-2570{background:var(--cur-2570-tint);color:var(--cur-2570);}
.plo-card{border:1px solid var(--border-default);border-radius:8px;padding:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg-surface);}
.field input[type=text]{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:11px 10px;font-size:14px;width:100%;min-height:44px;}
.m-btn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;border-radius:4px;padding:10px;min-height:44px;}
.m-btn-ghost{background:transparent;color:var(--text-primary);border:1px solid var(--border-default);}
</style>
</helmet>

<div class="m-shell">
  <div class="m-header"><div class="h1">ตั้งค่าหลักสูตร/PLO</div></div>

  <div class="m-content">
    <div class="caption text-secondary">Map: AB-01</div>

    <div class="tabrow">
      <button class="tabbtn tab-2565 {{tab2565Class}}" onClick="{{onTab2565}}">หลักสูตร 2565</button>
      <button class="tabbtn tab-2570 {{tab2570Class}}" onClick="{{onTab2570}}">หลักสูตร 2570</button>
    </div>

    <div style="display:flex;align-items:center;gap:8px;">
      <span class="caption text-secondary">กำลังแก้ไข PLO ของ</span>
      <span class="chip {{curChipClass}}">หลักสูตร {{curLabel}}</span>
    </div>

    <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
      <div class="body-sm text-secondary">หลักสูตร {{curLabel}} ยังไม่มี PLO — เริ่มเพิ่ม PLO ข้อแรก</div>
    </sc-if>

    <div style="display:flex;flex-direction:column;gap:8px;">
      <sc-for list="{{ploList}}" as="p" hint-placeholder-count="9">
        <div class="plo-card">
          <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
            <span class="mono caption">{{p.code}}</span>
            <span class="body-sm">{{p.desc}}</span>
          </div>
          <button class="m-btn m-btn-ghost" style="flex-shrink:0;padding:6px 10px;min-height:36px;font-size:12px;" onClick="{{p.remove}}">ลบ</button>
        </div>
      </sc-for>
    </div>

    <div class="field" style="display:flex;flex-direction:column;gap:8px;">
      <input type="text" placeholder="คำอธิบาย PLO ใหม่" value="{{newPlo}}" onInput="{{onNewPloInput}}">
      <button class="m-btn m-btn-ghost" onClick="{{onAddPlo}}">เพิ่ม PLO</button>
    </div>
  </div>

  <div class="m-tabbar">
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      <span>หลักสูตร</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3M10 7h10M4 12h3M10 12h10M4 17h3M10 17h10"/></svg>
      <span>รายวิชา</span>
    </div>
    <div class="m-tab active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg>
      <span>ตั้งค่า</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>
      <span>SAR</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/></svg>
      <span>Log</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/><path d="M4.5 19c0-3 3.5-5 7-5s7 2 7 5"/><path d="M15.5 10.5l1.5 1.5 3-3"/></svg>
      <span>บัญชี</span>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      tab: '2570', newPlo: '',
      plo2565: [
        { code: 'PLO1', desc: 'ผู้เรียนสามารถใช้ภาษาในการสื่อสารได้อย่างมีประสิทธิภาพ' },
        { code: 'PLO2', desc: 'ผู้เรียนสามารถใช้เทคโนโลยีการสื่อสารดิจิทัลอย่างรู้เท่าทันทั้งในฐานะผู้รับสารและผู้ส่งสารได้' },
        { code: 'PLO3', desc: 'ผู้เรียนสามารถจัดการชีวิตตนเองอย่างมีคุณธรรมและยึดมั่นในจริยธรรมของวิชาชีพ' },
        { code: 'PLO4', desc: 'ผู้เรียนสามารถทำงานร่วมกับผู้อื่นและแสดงออกถึงคุณลักษณะความเป็นพลเมืองที่มีคุณค่าต่อชุมชน สังคมไทยและสังคมโลก' },
        { code: 'PLO5', desc: 'ผู้เรียนสามารถแสดงออกซึ่งทักษะการเรียนรู้ตลอดชีวิต' },
        { code: 'PLO6', desc: 'ผู้เรียนสามารถออกแบบ และผลิตนวัตกรรมทางวิชาชีพด้านการสื่อสารด้วยกระบวนการคิดเชิงออกแบบอย่างสร้างสรรค์ได้' },
        { code: 'PLO7', desc: 'ผู้เรียนสามารถทำงานร่วมกับผู้อื่นอย่างเข้าใจและยอมรับความแตกต่างของผู้คนในสังคม และเคารพความคิดเห็นของผู้อื่น' },
        { code: 'PLO8', desc: 'ผู้เรียนสามารถสืบค้น วิเคราะห์ วิจัย ประเมินข้อมูลข่าวสารและประยุกต์ไปใช้ได้ในการสร้างสรรค์เนื้อหาและผลิตสื่ออย่างเหมาะสมตามลักษณะของงาน' },
        { code: 'PLO9', desc: 'ผู้เรียนสามารถเป็นผู้ประกอบการสื่อที่สามารถบริหารจัดการการสร้างเนื้อหาและผลิตสื่อและเผยแพร่ได้' }
      ],
      plo2570: [
        { code: 'PLO1', desc: 'ใช้หลักการและทฤษฎีด้านการสื่อสารและสื่อใหม่ เป็นฐานคิดในการสร้างสรรค์เนื้อหาและออกแบบการสื่อสารระดับวิชาชีพได้อย่างถูกต้อง' },
        { code: 'PLO2', desc: 'ออกแบบเนื้อหาสื่อใหม่ได้อย่างสร้างสรรค์และเป็นระบบ โดยคำนึงถึงบริบทของกลุ่มเป้าหมายที่หลากหลาย บนพื้นฐานของการรู้เท่าทันสื่อ วิจารณญาณ และจรรยาบรรณวิชาชีพ' },
        { code: 'PLO3', desc: 'ผลิตชิ้นงานสื่อใหม่โดยประยุกต์ใช้เทคโนโลยีดิจิทัลและปัญญาประดิษฐ์ อย่างชาญฉลาด และเท่าทันต่อการเปลี่ยนแปลงของอุตสาหกรรมสื่อ' },
        { code: 'PLO4', desc: 'สื่อสารผ่านสื่อใหม่โดยใช้ข้อมูลและการคิดวิเคราะห์ เพื่อให้เข้าถึงกลุ่มเป้าหมายได้อย่างตรงจุดและเกิดผลลัพธ์ที่วัดได้' },
        { code: 'PLO5', desc: 'บริหารจัดการสื่อใหม่เพื่อสร้างคุณค่าเชิงเศรษฐกิจและผลกระทบเชิงบวกต่อชุมชนและสังคม อย่างมีวิจารณญาณและความรับผิดชอบ' },
        { code: 'PLO6', desc: 'ปฏิบัติงานร่วมกับผู้อื่นได้อย่างมีภาวะผู้นำ มีทักษะมนุษยสัมพันธ์ (Soft Skills) และพัฒนาตนเองอย่างต่อเนื่องเพื่อรับมือกับการเปลี่ยนแปลงในวิชาชีพสื่อได้อย่างมั่นใจ' }
      ]
    };
  }
  renderVals() {
    const key = 'plo' + this.state.tab;
    const list = this.state[key];
    const ploList = list.map((p, i) => ({
      code: p.code, desc: p.desc,
      remove: () => {
        const next = list.slice();
        next.splice(i, 1);
        this.setState({ [key]: next });
      }
    }));
    return {
      tab2565Class: this.state.tab === '2565' ? 'active' : '',
      tab2570Class: this.state.tab === '2570' ? 'active' : '',
      curLabel: this.state.tab,
      curChipClass: this.state.tab === '2565' ? 'chip-2565' : 'chip-2570',
      ploList, isEmpty: list.length === 0, newPlo: this.state.newPlo,
      onTab2565: () => this.setState({ tab: '2565' }),
      onTab2570: () => this.setState({ tab: '2570' }),
      onNewPloInput: (e) => this.setState({ newPlo: e.target.value }),
      onAddPlo: () => {
        const desc = this.state.newPlo.trim();
        if (!desc) return;
        const maxNum = list.reduce((max, p) => Math.max(max, Number(p.code.replace('PLO', '')) || 0), 0);
        this.setState({ [key]: [...list, { code: 'PLO' + (maxNum + 1), desc }], newPlo: '' });
      }
    };
  }
}
</script>
</body>
</html>
