<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
  --border-default:#E2D9C8; --border-strong:#C9BBA0;
  --text-primary:#2B2620; --text-secondary:#6B6255; --text-disabled:#B3AA9A;
  --green:#5B6E4F; --green-dark:#46543D;
  --cur-2565:#A98F72; --cur-2565-tint:#F1E9DD;
  --cur-2570:#8A9A78; --cur-2570-tint:#EDF1E7;
}
*{box-sizing:border-box;} html,body{margin:0;}
body{background:var(--bg-sunken);color:var(--text-primary);font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;font-size:15px;line-height:22px;display:flex;justify-content:center;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
select{font-family:inherit;font-size:12px;color:var(--text-primary);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:6px 8px;}
.h1{font-size:19px;line-height:25px;font-weight:600;margin:0;}
.caption{font-size:11px;line-height:15px;}
.text-secondary{color:var(--text-secondary);}
.text-disabled{color:var(--text-disabled);}
.m-shell{width:375px;min-height:812px;background:var(--bg-base);display:flex;flex-direction:column;}
.m-header{height:52px;flex-shrink:0;display:flex;align-items:center;padding:0 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-default);}
.m-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.m-tabbar{flex-shrink:0;min-height:58px;background:var(--bg-surface);border-top:1px solid var(--border-default);display:flex;}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:9px;color:var(--text-secondary);min-height:44px;}
.m-tab.active{color:var(--green);}
.m-btn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:13px;font-weight:500;border-radius:4px;padding:9px 12px;min-height:40px;}
.m-btn-primary{background:var(--green);color:var(--bg-surface);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:4px;}
.chip-2565{background:var(--cur-2565-tint);color:var(--cur-2565);}
.chip-2570{background:var(--cur-2570-tint);color:var(--cur-2570);}
.m-card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:8px;}
</style>
</helmet>

<div class="m-shell">
  <div class="m-header"><div class="h1">เอกสาร SAR</div></div>

  <div class="m-content">
    <div class="caption text-secondary">Map: AB-17</div>

    <select value="{{scope}}" onChange="{{onScopeChange}}">
      <option value="all">ทั้งหมดในสิทธิ์ของฉัน</option>
      <option value="2565">เฉพาะ 2565</option>
      <option value="2570">เฉพาะ 2570</option>
    </select>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <sc-for list="{{courses}}" as="c" hint-placeholder-count="4">
        <div class="m-card">
          <div style="display:flex;align-items:center;gap:8px;">
            <span style="font-size:14px;flex:1;">{{c.name}}</span>
            <span class="chip {{c.curClass}}">{{c.cur}}</span>
          </div>
          <sc-if value="{{c.hasDoc}}" hint-placeholder-val="{{true}}">
            <button class="m-btn m-btn-primary" onClick="{{c.download}}">{{c.btnLabel}}</button>
          </sc-if>
          <sc-if value="{{c.noDoc}}" hint-placeholder-val="{{false}}">
            <span class="caption text-disabled">ยังไม่มีเอกสาร — แจ้งอาจารย์ผู้สอนให้สร้างก่อน</span>
          </sc-if>
        </div>
      </sc-for>
    </div>

    <div class="caption text-secondary">เอกสารที่ดาวน์โหลดมีข้อมูลกลุ่มหลักสูตรกำกับไว้ชัดเจน พร้อมนำไปแนบใน SAR ได้โดยตรง</div>
  </div>

  <div class="m-tabbar">
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      <span>หลักสูตร</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h3M10 7h10M4 12h3M10 12h10M4 17h3M10 17h10"/></svg>
      <span>รายวิชา</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="20" y2="18"/><circle cx="7" cy="18" r="2"/></svg>
      <span>ตั้งค่า</span>
    </div>
    <div class="m-tab active">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M12 12v6M9.5 15.5 12 18l2.5-2.5"/></svg>
      <span>SAR</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v6c0 5-3.5 8-7 9-3.5-1-7-4-7-9V6z"/></svg>
      <span>Log</span>
    </div>
    <div class="m-tab">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8.5a3.5 3.5 0 1 1 7 0 3.5 3.5 0 0 1-7 0z"/><path d="M4.5 19c0-3 3.5-5 7-5s7 2 7 5"/><path d="M15.5 10.5l1.5 1.5 3-3"/></svg>
      <span>บัญชี</span>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      scope: 'all',
      courses: [
        { name: '70127121 การรู้เท่าทันสื่อดิจิทัลและการตรวจสอบข้อเท็จจริง', cur: '2570', hasDoc: true, downloaded: false },
        { name: '127121 การรู้เท่าทันสื่อดิจิทัล', cur: '2565', hasDoc: true, downloaded: false },
        { name: '70127211 การบริหารจัดการแพลตฟอร์มโซเชียลมีเดียและอัลกอริทึมศึกษา', cur: '2570', hasDoc: false, downloaded: false },
        { name: '125212 จิตวิทยาเพื่อการสื่อสาร', cur: '2565', hasDoc: true, downloaded: false }
      ]
    };
  }
  renderVals() {
    const filtered = this.state.courses.filter((c) => this.state.scope === 'all' || c.cur === this.state.scope);
    const courses = filtered.map((c) => {
      const idx = this.state.courses.indexOf(c);
      return {
        name: c.name, cur: c.cur,
        curClass: c.cur === '2565' ? 'chip-2565' : 'chip-2570',
        hasDoc: c.hasDoc, noDoc: !c.hasDoc,
        btnLabel: c.downloaded ? 'ดาวน์โหลดแล้ว — อีกครั้ง' : 'ดาวน์โหลดเอกสาร',
        download: () => {
          const next = this.state.courses.slice();
          next[idx] = { ...next[idx], downloaded: true };
          this.setState({ courses: next });
        }
      };
    });
    return { scope: this.state.scope, courses, onScopeChange: (e) => this.setState({ scope: e.target.value }) };
  }
}
</script>
</body>
</html>
