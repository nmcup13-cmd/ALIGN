<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
  --border-default:#E2D9C8; --border-strong:#C9BBA0;
  --text-primary:#2B2620; --text-secondary:#6B6255; --text-disabled:#B3AA9A;
  --green:#5B6E4F; --green-dark:#46543D;
  --cur-2570:#8A9A78; --cur-2570-tint:#EDF1E7;
}
*{box-sizing:border-box;} html,body{margin:0;}
body{background:var(--bg-sunken);color:var(--text-primary);font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;font-size:15px;line-height:22px;display:flex;justify-content:center;}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;font-size:14px;color:var(--text-primary);}
.m-shell{width:375px;min-height:812px;background:var(--bg-base);display:flex;flex-direction:column;}
.m-header{height:52px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px;background:var(--bg-surface);border-bottom:1px solid var(--border-default);}
.m-content{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:14px;}
.m-tabbar{flex-shrink:0;min-height:60px;background:var(--bg-surface);border-top:1px solid var(--border-default);display:flex;}
.m-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;color:var(--text-secondary);min-height:44px;}
.m-tab.active{color:var(--green);}
.m-card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:16px;}
.h1{font-size:19px;line-height:25px;font-weight:600;margin:0;}
.body-sm{font-size:13px;line-height:18px;}
.caption{font-size:11px;line-height:15px;}
.text-secondary{color:var(--text-secondary);}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11px;padding:2px 7px;border-radius:4px;background:var(--cur-2570-tint);color:var(--cur-2570);}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;color:var(--text-secondary);}
.field input, .field select{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:11px 10px;font-size:14px;min-height:44px;width:100%;}
.m-btn{display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;font-weight:500;border-radius:4px;padding:10px 14px;min-height:44px;}
.m-btn-primary{background:var(--green);color:var(--bg-surface);}
.m-btn-primary.is-disabled{background:var(--text-disabled);}
.m-btn-ghost{background:transparent;color:var(--text-primary);border:1px solid var(--border-default);}
.evidence-row{display:flex;align-items:center;justify-content:space-between;gap:8px;border:1px solid var(--border-default);border-radius:4px;padding:8px 10px;background:var(--bg-surface);min-height:44px;}
</style>
</helmet>

<div class="m-shell">
  <div class="m-header">
    <div class="h1" style="flex:1;">บันทึกการสอน</div>
    <span class="chip">2570</span>
  </div>

  <div class="m-content">
    <div class="caption text-secondary">ระบบฐานข้อมูล · Map: AB-05, AB-06, AB-07</div>

    <sc-if value="{{formVisible}}" hint-placeholder-val="{{true}}">
      <div class="m-card" style="display:flex;flex-direction:column;gap:16px;">
        <div class="field">
          <label>สัปดาห์ที่สอน</label>
          <select value="{{week}}" onChange="{{onWeekChange}}">
            <sc-for list="{{weekOptions}}" as="w" hint-placeholder-count="16">
              <option value="{{w}}">สัปดาห์ที่ {{w}}</option>
            </sc-for>
          </select>
        </div>
        <div class="field">
          <label>วันที่สอนจริง</label>
          <input type="date" value="{{taughtOn}}" max="{{today}}" onInput="{{onDateInput}}">
        </div>
        <div class="field">
          <label>หัวข้อการสอน</label>
          <input type="text" placeholder="เช่น Normalization และ ER Diagram" value="{{topic}}" onInput="{{onTopicInput}}">
        </div>

        <div style="display:flex;flex-direction:column;gap:8px;">
          <div class="body-sm" style="font-weight:500;">หลักฐาน/ชิ้นงานแนบ</div>
          <sc-if value="{{noEvidence}}" hint-placeholder-val="{{false}}">
            <div class="caption text-secondary">ยังไม่มีไฟล์แนบ</div>
          </sc-if>
          <sc-for list="{{evidence}}" as="ev" hint-placeholder-count="2">
            <div class="evidence-row">
              <div style="display:flex;align-items:center;gap:8px;min-width:0;">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><path d="M9 15V6a3 3 0 0 1 6 0v9a5 5 0 0 1-10 0V8"/></svg>
                <span class="body-sm" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">{{ev.name}}</span>
              </div>
              <button class="m-btn m-btn-ghost" style="padding:6px 10px;min-height:32px;font-size:12px;flex-shrink:0;" onClick="{{ev.remove}}">ลบ</button>
            </div>
          </sc-for>
          <div style="display:flex;flex-direction:column;gap:8px;">
            <input type="text" placeholder="ชื่อไฟล์แนบ" value="{{newFile}}" onInput="{{onFileInput}}">
            <button class="m-btn m-btn-ghost" onClick="{{onAttach}}">แนบไฟล์</button>
          </div>
        </div>

        <button class="m-btn m-btn-primary {{submitDisabledClass}}" onClick="{{onSubmit}}">บันทึกและให้ AI ประมวลผล</button>
      </div>
    </sc-if>

    <sc-if value="{{submitted}}" hint-placeholder-val="{{false}}">
      <div class="m-card" style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;gap:8px;color:var(--green);">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4 4L19 7"/></svg>
          <span class="body-sm" style="font-weight:500;color:var(--green);">บันทึกเรียบร้อย</span>
        </div>
        <div class="caption text-secondary">กำลังส่งให้ AI ประมวลผล — ดูผลที่หน้า "ตรวจสอบผล AI"</div>
      </div>
    </sc-if>
  </div>

  <div class="m-tabbar">
    <div class="m-tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
      <span>หน้าแรก</span>
    </div>
    <div class="m-tab active">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 18.5z"/><path d="M5 17.5C5 16.7 5.7 16 6.5 16H19"/></svg>
      <span>รายวิชา</span>
    </div>
    <div class="m-tab">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
      <span>CLO×สัปดาห์</span>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    const today = new Date().toISOString().slice(0, 10);
    this.state = {
      week: 6, taughtOn: today, today, topic: '', newFile: '', submitted: false,
      evidence: [
        { name: 'สไลด์บรรยาย Normalization.pdf' },
        { name: 'งานนักศึกษา - แบบฝึกหัด ER.pdf' }
      ]
    };
  }
  renderVals() {
    const canSubmit = this.state.topic.trim().length > 0 && this.state.evidence.length > 0;
    const evidence = this.state.evidence.map((ev, i) => ({
      name: ev.name,
      remove: () => {
        const next = this.state.evidence.slice();
        next.splice(i, 1);
        this.setState({ evidence: next });
      }
    }));
    return {
      week: this.state.week,
      weekOptions: Array.from({ length: 16 }, (_, i) => i + 1),
      taughtOn: this.state.taughtOn, today: this.state.today,
      topic: this.state.topic, newFile: this.state.newFile,
      evidence, noEvidence: this.state.evidence.length === 0,
      submitted: this.state.submitted, formVisible: !this.state.submitted,
      submitDisabledClass: canSubmit ? '' : 'is-disabled',
      onWeekChange: (e) => this.setState({ week: e.target.value }),
      onDateInput: (e) => this.setState({ taughtOn: e.target.value }),
      onTopicInput: (e) => this.setState({ topic: e.target.value }),
      onFileInput: (e) => this.setState({ newFile: e.target.value }),
      onAttach: () => {
        const name = this.state.newFile.trim();
        if (!name) return;
        this.setState({ evidence: [...this.state.evidence, { name }], newFile: '' });
      },
      onSubmit: () => { if (canSubmit) this.setState({ submitted: true }); }
    };
  }
}
</script>
</body>
</html>
