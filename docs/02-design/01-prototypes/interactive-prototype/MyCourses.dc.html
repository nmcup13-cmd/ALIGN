<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg-base:#F6F2EA; --bg-surface:#FDFBF7; --bg-sunken:#EFE9DD;
  --border-default:#E2D9C8; --border-strong:#C9BBA0;
  --text-primary:#2B2620; --text-secondary:#6B6255; --text-disabled:#B3AA9A;
  --green:#5B6E4F; --green-dark:#46543D; --green-tint:#E8ECE2;
  --draft:#B8863C; --draft-tint:#F3E6CE;
  --gap:#A65D45; --gap-tint:#F5E3DC; --info:#6E7B8B;
  --cur-2565:#A98F72; --cur-2565-tint:#F1E9DD;
  --cur-2570:#8A9A78; --cur-2570-tint:#EDF1E7;
}
*{box-sizing:border-box;}
html,body{margin:0;}
body{background:var(--bg-base);color:var(--text-primary);font-family:'IBM Plex Sans Thai Looped','Sarabun',system-ui,sans-serif;font-size:16px;line-height:24px;}
a{color:var(--green);text-decoration:none;} a:hover{color:var(--green-dark);}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;}
input,select{font-family:inherit;font-size:14px;color:var(--text-primary);}
.mono{font-family:'IBM Plex Mono',monospace;}
.h1{font-size:24px;line-height:32px;font-weight:600;margin:0;}
.h2{font-size:20px;line-height:28px;font-weight:500;margin:0;}
.h3{font-size:16px;line-height:24px;font-weight:500;margin:0;}
.body-sm{font-size:14px;line-height:20px;}
.caption{font-size:12px;line-height:16px;}
.text-secondary{color:var(--text-secondary);}
.text-disabled{color:var(--text-disabled);}
.app-header{height:64px;background:var(--bg-surface);border-bottom:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;}
.wordmark{font-size:20px;line-height:28px;font-weight:600;color:var(--green);}
.role-badge{font-size:12px;line-height:16px;padding:2px 8px;border:1px solid var(--border-default);border-radius:4px;color:var(--text-secondary);}
.side-nav{width:216px;background:var(--bg-base);border-right:1px solid var(--border-default);flex-shrink:0;padding:16px 8px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:4px;font-size:14px;line-height:20px;color:var(--text-primary);}
.nav-item.active{background:var(--green-tint);color:var(--green);font-weight:500;}
.nav-item svg{flex-shrink:0;}
.content{flex:1;padding:32px;overflow:auto;}
.card{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:8px;padding:24px;}
.btn{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;border-radius:4px;padding:8px 16px;line-height:20px;}
.btn-primary{background:var(--green);color:var(--bg-surface);}
.btn-primary:hover{background:var(--green-dark);}
.btn-ghost{background:transparent;color:var(--text-primary);border:1px solid var(--border-default);}
.btn-ghost:hover{border-color:var(--border-strong);}
.btn-sm{padding:5px 10px;font-size:12px;line-height:16px;}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;padding:3px 8px;border-radius:4px;}
.chip-2565{background:var(--cur-2565-tint);color:var(--cur-2565);}
.chip-2570{background:var(--cur-2570-tint);color:var(--cur-2570);}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:12px;line-height:16px;padding:3px 8px;border-radius:4px;}
.badge-confirmed{border:1.5px solid var(--green);color:var(--green);background:var(--bg-surface);}
.badge-draft{border:1.5px dashed var(--draft);color:var(--draft);background:var(--draft-tint);}
.row-card{border:1px solid var(--border-default);border-radius:8px;padding:16px;background:var(--bg-surface);display:flex;align-items:center;justify-content:space-between;gap:16px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12px;line-height:16px;color:var(--text-secondary);}
.field input[type=text], .field select{background:var(--bg-surface);border:1px solid var(--border-default);border-radius:4px;padding:9px 10px;font-size:14px;color:var(--text-primary);min-width:200px;}
.field input:focus, .field select:focus{outline:none;border-color:var(--border-strong);}
</style>
</helmet>

<div style="display:flex;flex-direction:column;height:100%;min-height:780px;">
  <div class="app-header">
    <div class="wordmark">ALIGN</div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span class="body-sm">อ.ธนกร ใจดี</span>
      <span class="role-badge">Instructor</span>
    </div>
  </div>
  <div style="display:flex;flex:1;min-height:0;">
    <div class="side-nav">
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11.5 12 4l8 7.5"/><path d="M6 10v9a1 1 0 0 0 1 1h4v-6h2v6h4a1 1 0 0 0 1-1v-9"/></svg>
        <span>หน้าแรก</span>
      </div>
      <div class="nav-item active">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H18a1 1 0 0 1 1 1v15a1 1 0 0 1-1 1H6.5A1.5 1.5 0 0 1 5 18.5z"/><path d="M5 17.5C5 16.7 5.7 16 6.5 16H19"/></svg>
        <span>รายวิชาของฉัน</span>
      </div>
      <div class="nav-item">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="6" height="6" rx="1"/><rect x="14" y="4" width="6" height="6" rx="1"/><rect x="4" y="14" width="6" height="6" rx="1"/><rect x="14" y="14" width="6" height="6" rx="1"/></svg>
        <span>แผนที่ CLO × สัปดาห์</span>
      </div>
    </div>

    <div class="content">
      <div style="display:flex;flex-direction:column;gap:24px;max-width:820px;">

        <div style="display:flex;align-items:center;justify-content:space-between;">
          <div class="h1">รายวิชาของฉัน</div>
          <button class="btn btn-primary" onClick="{{toggleForm}}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            เพิ่มรายวิชา
          </button>
        </div>
        <div class="caption text-secondary">Map: AB-02 (ทางเข้า), AB-19 (ทางเข้า)</div>

        <sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}">
          <div class="card" style="display:flex;flex-direction:column;gap:16px;">
            <div class="h3">เพิ่มรายวิชาใหม่</div>
            <div style="display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;">
              <div class="field">
                <label>ชื่อรายวิชา</label>
                <input type="text" placeholder="เช่น ปัญญาประดิษฐ์เบื้องต้น" value="{{newName}}" onInput="{{onNameInput}}">
              </div>
              <div class="field">
                <label>กลุ่มหลักสูตร</label>
                <select value="{{newCur}}" onChange="{{onCurChange}}">
                  <option value="2565">2565</option>
                  <option value="2570">2570</option>
                </select>
              </div>
              <button class="btn btn-primary" onClick="{{onAdd}}">เพิ่ม</button>
              <button class="btn btn-ghost" onClick="{{toggleForm}}">ยกเลิก</button>
            </div>
          </div>
        </sc-if>

        <div style="display:flex;flex-direction:column;gap:12px;">
          <sc-for list="{{courses}}" as="c" hint-placeholder-count="4">
            <div class="row-card">
              <div style="display:flex;align-items:center;gap:12px;">
                <span class="h3">{{c.name}}</span>
                <span class="chip {{c.curClass}}">{{c.curLabel}}</span>
              </div>
              <span class="badge {{c.badgeClass}}">{{c.badgeLabel}}</span>
            </div>
          </sc-for>
        </div>

      </div>
    </div>
  </div>
</div>

</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      formOpen: false,
      newName: '',
      newCur: '2570',
      courses: [
        { name: 'การเขียนโปรแกรมเชิงวัตถุ', cur: '2570', ready: true },
        { name: 'หลักการออกแบบส่วนติดต่อผู้ใช้', cur: '2565', ready: true },
        { name: 'ระบบฐานข้อมูล', cur: '2570', ready: true },
        { name: 'ปัญญาประดิษฐ์เบื้องต้น', cur: '2570', ready: false }
      ]
    };
  }
  renderVals() {
    const courses = this.state.courses.map((c) => ({
      name: c.name,
      curClass: c.cur === '2565' ? 'chip-2565' : 'chip-2570',
      curLabel: c.cur,
      badgeClass: c.ready ? 'badge-confirmed' : 'badge-draft',
      badgeLabel: c.ready ? 'พร้อมบันทึกการสอน' : 'ยังตั้งค่าไม่ครบ'
    }));
    return {
      courses,
      formOpen: this.state.formOpen,
      newName: this.state.newName,
      newCur: this.state.newCur,
      toggleForm: () => this.setState({ formOpen: !this.state.formOpen }),
      onNameInput: (e) => this.setState({ newName: e.target.value }),
      onCurChange: (e) => this.setState({ newCur: e.target.value }),
      onAdd: () => {
        const name = this.state.newName.trim();
        if (!name) return;
        this.setState({
          courses: [...this.state.courses, { name, cur: this.state.newCur, ready: false }],
          newName: '',
          formOpen: false
        });
      }
    };
  }
}
</script>
</body>
</html>
